name: Release

on:
  push:
    tags:
      # Only trigger on semver tags that start with "v", e.g. v0.0.1, v1.2.3
      # '+' = one or more of the preceding character; '.' is literal.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history and tags so maven-git-versioning-extension can
          # resolve the version from the pushed tag.
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The Maven version is derived from the tag by the
      # maven-git-versioning-extension (.mvn/extensions.xml), so tag v0.0.1
      # builds version 0.0.1 automatically. No manual version bump needed.
      - name: Build
        run: ./mvnw -B -ntp clean package

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp telemetry-spring-boot-starter/target/*.jar dist/
          cp telemetry-sample-app/target/*.jar dist/
          ls -1 dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
