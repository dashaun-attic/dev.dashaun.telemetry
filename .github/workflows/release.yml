name: Release

on:
  push:
    tags:
      # Only trigger on semver tags that start with "v", e.g. v0.0.1, v1.2.3
      # '+' = one or more of the preceding character; '.' is literal.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history and tags so maven-git-versioning-extension can
          # resolve the version from the pushed tag.
          fetch-depth: 0

      - name: Set up Liberica JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '17'
          cache: maven

      # The Maven version is derived from the tag by the
      # maven-git-versioning-extension (.mvn/extensions.xml). The explicit
      # versions:set below is a deterministic safeguard so the release
      # artifacts always match the tag (v2.6.0 -> 2.6.0), even if the
      # extension cannot resolve the tag in the runner.
      - name: Set Maven version to match tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME}"
          echo "Version from tag: ${VERSION}"
          ./mvnw -B -ntp versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Build
        run: ./mvnw -B -ntp clean package

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp telemetry-spring-boot-starter/target/*.jar dist/
          cp telemetry-sample-app/target/*.jar dist/
          ls -1 dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
