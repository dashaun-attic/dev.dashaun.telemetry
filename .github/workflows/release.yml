name: Release

on:
  push:
    tags:
      # Only trigger on semver tags that start with "v", e.g. v0.0.1, v1.2.3
      - 'v[0-9][0-9]*.[0-9][0-9]*.[0-9][0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Set Maven version to match tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag:        ${GITHUB_REF_NAME}"
          echo "Maven ver:  ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ./mvnw -B -ntp versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Build
        run: ./mvnw -B -ntp clean package

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp telemetry-spring-boot-starter/target/*.jar dist/
          cp "telemetry-sample-app/target/telemetry-sample-app-${VERSION}.jar" dist/
          ls -1 dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
